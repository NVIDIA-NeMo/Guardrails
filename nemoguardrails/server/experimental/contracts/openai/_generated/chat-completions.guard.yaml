version: 1.0.0-alpha.1
operationId: createChatCompletion
profile: single_text.v1
request:
  additionalProperties: false
  description: Bind the handwritten projection to its guarded runtime semantics.
  properties:
    audio:
      default: null
      type: 'null'
      x-nemo-guardrails:
        classification: constrained
        gate: disabled
        reason: core_capability.audio_content
    frequency_penalty:
      x-nemo-guardrails:
        classification: opaque
    function_call:
      default: null
      type: 'null'
      x-nemo-guardrails:
        classification: constrained
        gate: disabled
        reason: core_capability.tool_content
    functions:
      default: null
      type: 'null'
      x-nemo-guardrails:
        classification: constrained
        gate: disabled
        reason: core_capability.tool_content
    logit_bias:
      x-nemo-guardrails:
        classification: opaque
    logprobs:
      default: null
      x-nemo-guardrails:
        classification: constrained
        reason: provider_integrity.token_logprobs
      oneOf:
      - const: false
        type: boolean
      - type: 'null'
    max_completion_tokens:
      x-nemo-guardrails:
        classification: opaque
    max_tokens:
      x-nemo-guardrails:
        classification: opaque
    messages:
      items:
        additionalProperties: false
        description: Accept one user text message with reviewed optional provider
          metadata.
        properties:
          content:
            minLength: 1
            type: string
            x-nemo-guardrails:
              classification: guarded
              subject:
                kind: text
                replaceable: true
                role: user
          name:
            default: null
            type: 'null'
            x-nemo-guardrails:
              classification: constrained
              gate: disabled
              reason: core_capability.participant_name
          role:
            const: user
            type: string
            x-nemo-guardrails:
              classification: constrained
        required:
        - content
        - role
        title: ChatCompletionsUserMessageProjection
        type: object
        x-nemo-guardrails:
          source: '#/components/schemas/ChatCompletionRequestUserMessage'
          unknown_fields: configurable
          reject_case_aliases: true
      maxItems: 1
      minItems: 1
      type: array
      x-nemo-guardrails:
        classification: guarded
    metadata:
      x-nemo-guardrails:
        classification: opaque
    modalities:
      default: null
      type: 'null'
      x-nemo-guardrails:
        classification: constrained
        gate: disabled
        reason: core_capability.multimodal_content
    model:
      x-nemo-guardrails:
        classification: opaque
    moderation:
      x-nemo-guardrails:
        classification: opaque
    n:
      const: 1
      default: 1
      type: integer
      x-nemo-guardrails:
        classification: constrained
        reason: core_capability.single_text_target
    parallel_tool_calls:
      default: null
      type: 'null'
      x-nemo-guardrails:
        classification: constrained
        gate: disabled
        reason: core_capability.tool_content
    prediction:
      default: null
      type: 'null'
      x-nemo-guardrails:
        classification: constrained
        gate: disabled
        reason: core_capability.predicted_content
    presence_penalty:
      x-nemo-guardrails:
        classification: opaque
    prompt_cache_key:
      x-nemo-guardrails:
        classification: opaque
    prompt_cache_options:
      x-nemo-guardrails:
        classification: opaque
    prompt_cache_retention:
      x-nemo-guardrails:
        classification: opaque
    reasoning_effort:
      default: null
      x-nemo-guardrails:
        classification: constrained
      oneOf:
      - enum:
        - none
        - minimal
        - low
        - medium
        - high
        - xhigh
        - max
        type: string
      - type: 'null'
    response_format:
      default: null
      type: 'null'
      x-nemo-guardrails:
        classification: constrained
        gate: disabled
        reason: projection_policy.plain_text_output
    safety_identifier:
      x-nemo-guardrails:
        classification: opaque
    seed:
      x-nemo-guardrails:
        classification: opaque
    service_tier:
      x-nemo-guardrails:
        classification: opaque
    stop:
      x-nemo-guardrails:
        classification: opaque
    store:
      x-nemo-guardrails:
        classification: opaque
    stream:
      default: false
      type: boolean
      x-nemo-guardrails:
        classification: constrained
    stream_options:
      x-nemo-guardrails:
        classification: opaque
    temperature:
      x-nemo-guardrails:
        classification: opaque
    tool_choice:
      default: null
      type: 'null'
      x-nemo-guardrails:
        classification: constrained
        gate: disabled
        reason: core_capability.tool_content
    tools:
      default: null
      type: 'null'
      x-nemo-guardrails:
        classification: constrained
        gate: disabled
        reason: core_capability.tool_content
    top_logprobs:
      default: null
      type: 'null'
      x-nemo-guardrails:
        classification: constrained
        gate: disabled
        reason: provider_integrity.token_logprobs
    top_p:
      x-nemo-guardrails:
        classification: opaque
    user:
      x-nemo-guardrails:
        classification: opaque
    verbosity:
      x-nemo-guardrails:
        classification: opaque
    web_search_options:
      default: null
      type: 'null'
      x-nemo-guardrails:
        classification: constrained
        gate: disabled
        reason: core_capability.tool_content
  required:
  - messages
  title: openai.chat_completions.request.text.v1
  type: object
  x-nemo-guardrails:
    unknown_fields: forbid
    reject_case_aliases: true
    model: ChatCompletionsGuardedRequest
    stream_selector_field: stream
response:
  additionalProperties: false
  description: Bind the handwritten projection to its guarded runtime semantics.
  properties:
    choices:
      items:
        additionalProperties: false
        description: Expose the guarded message while preserving opaque choice metadata.
        properties:
          finish_reason:
            default: null
            x-nemo-guardrails:
              classification: opaque
          index:
            default: null
            x-nemo-guardrails:
              classification: opaque
          logprobs:
            default: null
            type: 'null'
            x-nemo-guardrails:
              classification: constrained
              gate: disabled
              reason: provider_integrity.token_logprobs
          message:
            additionalProperties: false
            description: Accept assistant text while preventing replacement of annotated
              content.
            properties:
              annotations:
                default: null
                x-nemo-guardrails:
                  classification: constrained
                  reason: core_capability.citation_content
                oneOf:
                - items: {}
                  maxItems: 0
                  type: array
                - type: 'null'
              audio:
                default: null
                type: 'null'
                x-nemo-guardrails:
                  classification: constrained
                  gate: disabled
                  reason: core_capability.audio_content
              content:
                x-nemo-guardrails:
                  classification: guarded
                  subject:
                    kind: text
                    replaceable: true
                    replacement_blocked_by: annotations
                    replacement_reason: provider_integrity.annotated_text
                    role: assistant
                oneOf:
                - type: string
                - type: 'null'
              function_call:
                default: null
                type: 'null'
                x-nemo-guardrails:
                  classification: constrained
                  gate: disabled
                  reason: core_capability.tool_content
              reasoning_content:
                default: null
                type: 'null'
                x-nemo-guardrails:
                  classification: constrained
                  extension: true
                  gate: disabled
                  reason: core_capability.reasoning_content
              refusal:
                default: null
                type: 'null'
                x-nemo-guardrails:
                  classification: constrained
                  gate: disabled
                  reason: core_capability.refusal_content
              role:
                const: assistant
                type: string
                x-nemo-guardrails:
                  classification: constrained
              tool_calls:
                default: null
                x-nemo-guardrails:
                  classification: constrained
                  reason: core_capability.tool_content
                oneOf:
                - items: {}
                  maxItems: 0
                  type: array
                - type: 'null'
            required:
            - content
            - role
            title: ChatCompletionsAssistantMessageProjection
            type: object
            x-nemo-guardrails:
              classification: guarded
              source: '#/components/schemas/ChatCompletionResponseMessage'
              unknown_fields: configurable
              reject_case_aliases: true
        required:
        - message
        title: ChatCompletionsChoiceProjection
        type: object
        x-nemo-guardrails:
          unknown_fields: configurable
          reject_case_aliases: true
      maxItems: 1
      minItems: 1
      type: array
      x-nemo-guardrails:
        classification: guarded
    created:
      x-nemo-guardrails:
        classification: opaque
    id:
      x-nemo-guardrails:
        classification: opaque
    metadata:
      x-nemo-guardrails:
        classification: opaque
    model:
      x-nemo-guardrails:
        classification: opaque
    moderation:
      x-nemo-guardrails:
        classification: opaque
    object:
      x-nemo-guardrails:
        classification: opaque
    service_tier:
      x-nemo-guardrails:
        classification: opaque
    system_fingerprint:
      x-nemo-guardrails:
        classification: opaque
    usage:
      x-nemo-guardrails:
        classification: opaque
  required:
  - choices
  title: openai.chat_completions.response.text.v1
  type: object
  x-nemo-guardrails:
    unknown_fields: forbid
    reject_case_aliases: true
    model: ChatCompletionsGuardedResponse
integration:
  name: chat_completions
  endpoint:
    route_path: /v1/chat/completions
    operation_label: OpenAI Chat Completions
    unsupported_request_code: unsupported_chat_completions_shape
    unsupported_response_code: unsupported_chat_completions_response_shape
stream:
  title: openai.chat_completions.stream.text.v1
  oneOf:
  - additionalProperties: false
    description: Allow one text choice or an empty usage chunk, preserving root metadata.
    properties:
      choices:
        items:
          additionalProperties: false
          description: Require integer choice zero and reject unreviewed choice-level
            content.
          properties:
            delta:
              additionalProperties: false
              description: Accept assistant text or metadata-only deltas within a
                closed boundary.
              properties:
                audio:
                  default: null
                  type: 'null'
                  x-nemo-guardrails:
                    classification: constrained
                    extension: true
                    gate: disabled
                    reason: core_capability.audio_content
                content:
                  default: null
                  x-nemo-guardrails:
                    classification: guarded
                    subject:
                      kind: text
                      role: assistant
                  oneOf:
                  - type: string
                  - type: 'null'
                function_call:
                  default: null
                  type: 'null'
                  x-nemo-guardrails:
                    classification: constrained
                    gate: disabled
                    reason: core_capability.tool_content
                reasoning_content:
                  default: null
                  type: 'null'
                  x-nemo-guardrails:
                    classification: constrained
                    extension: true
                    gate: disabled
                    reason: core_capability.reasoning_content
                refusal:
                  default: null
                  type: 'null'
                  x-nemo-guardrails:
                    classification: constrained
                    gate: disabled
                    reason: core_capability.refusal_content
                role:
                  default: null
                  x-nemo-guardrails:
                    classification: constrained
                  oneOf:
                  - const: assistant
                    type: string
                  - type: 'null'
                tool_calls:
                  default: null
                  type: 'null'
                  x-nemo-guardrails:
                    classification: constrained
                    gate: disabled
                    reason: core_capability.tool_content
              title: ChatCompletionsStreamDeltaProjection
              type: object
              x-nemo-guardrails:
                classification: guarded
                source: '#/components/schemas/ChatCompletionStreamResponseDelta'
                unknown_fields: forbid
                reject_case_aliases: true
            finish_reason:
              default: null
              x-nemo-guardrails:
                classification: opaque
            index:
              const: 0
              type: integer
              x-nemo-guardrails:
                classification: constrained
            logprobs:
              default: null
              type: 'null'
              x-nemo-guardrails:
                classification: constrained
                gate: disabled
                reason: provider_integrity.token_logprobs
          required:
          - delta
          - index
          title: ChatCompletionsStreamChoiceProjection
          type: object
          x-nemo-guardrails:
            unknown_fields: forbid
            reject_case_aliases: true
        maxItems: 1
        type: array
        x-nemo-guardrails:
          classification: guarded
      created:
        x-nemo-guardrails:
          classification: opaque
      id:
        x-nemo-guardrails:
          classification: opaque
      model:
        x-nemo-guardrails:
          classification: opaque
      moderation:
        x-nemo-guardrails:
          classification: opaque
      obfuscation:
        x-nemo-guardrails:
          classification: opaque
      object:
        const: chat.completion.chunk
        type: string
        x-nemo-guardrails:
          classification: constrained
      service_tier:
        x-nemo-guardrails:
          classification: opaque
      system_fingerprint:
        x-nemo-guardrails:
          classification: opaque
      usage:
        x-nemo-guardrails:
          classification: opaque
    required:
    - choices
    - object
    title: ChatCompletionsStreamPayloadProjection
    type: object
    x-nemo-guardrails:
      source: '#/components/schemas/CreateChatCompletionStreamResponse'
      unknown_fields: forbid
      reject_case_aliases: true
      model: ChatCompletionsStreamPayloadProjection
      event:
        classification: guarded_delta
        variants:
        - source_schema: CreateChatCompletionStreamResponse
          shape: chat.completion.chunk:content
          match:
            object: chat.completion.chunk
        missing_text: opaque
        missing_text_shape: chat.completion.chunk:metadata
  - additionalProperties: false
    description: Accept only an error envelope, never an error mixed with generated
      content.
    properties:
      error:
        additionalProperties: false
        description: Validate the native error message without treating it as guarded
          text.
        properties:
          code:
            default: null
            x-nemo-guardrails:
              classification: opaque
          message:
            type: string
            x-nemo-guardrails:
              classification: constrained
          misalignment:
            default: null
            x-nemo-guardrails:
              classification: opaque
          param:
            default: null
            x-nemo-guardrails:
              classification: opaque
          type:
            default: null
            x-nemo-guardrails:
              classification: opaque
        required:
        - message
        title: ChatCompletionsStreamErrorDetailsProjection
        type: object
        x-nemo-guardrails:
          classification: constrained
          source: '#/components/schemas/Error'
          unknown_fields: configurable
          reject_case_aliases: true
    required:
    - error
    title: ChatCompletionsStreamErrorProjection
    type: object
    x-nemo-guardrails:
      source: '#/components/schemas/ErrorResponse'
      unknown_fields: forbid
      reject_case_aliases: true
      model: ChatCompletionsStreamErrorProjection
      event:
        classification: provider_error
        variants:
        - source_schema: ErrorResponse
          shape: error
          required_fields:
          - error
  x-nemo-guardrails:
    transport:
      require_sse_event: false
      non_data_shape: '[DONE]'
      sentinels:
        '[DONE]': '[DONE]'
