name: Test Docker Image

# TODO: set docker auth
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test-docker.yml"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE: nemoguardrails
    steps:
      #
      # Checkout the code
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      # Get runner architecture
      - name: Get runner architecture
        id: runner-arch
        run: echo "arch=$(uname -m)" >> $GITHUB_OUTPUT

      - name: Set Docker tags
        run: |
          ARCH=${STEPS_RUNNER_ARCH_OUTPUTS_ARCH}
          echo "TEST_TAG=${{ env.IMAGE }}:${{ github.sha }}-$ARCH" >> $GITHUB_ENV
        env:
          STEPS_RUNNER_ARCH_OUTPUTS_ARCH: ${{ steps.runner-arch.outputs.arch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.TEST_TAG }}
          cache-from: type=gha,scope=nemoguardrails-test
          cache-to: type=gha,mode=max,scope=nemoguardrails-test

      # Start the container in detached mode
      - name: Start container
        run: docker run -d --name test_container -p 8000:8000 ${TEST_TAG}

      # Wait for the container to be ready
      - name: Wait for container to be ready
        timeout-minutes: 3
        run: |
          echo "Waiting for container to be ready..."
          until curl --output /dev/null --silent --fail http://localhost:8000/v1/rails/configs; do
            printf '.'
            sleep 2
          done
          echo "Container is ready!"

      # Perform a health check on the server
      - name: Check server status
        run: |
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/v1/rails/configs)
          if [ "$RESPONSE_CODE" -ne 200 ]; then
            echo "Server responded with code $RESPONSE_CODE."
            exit 1
          fi

      # Run additional tests on the running container
      - name: Run tests
        run: |
          # Example test command
          curl -f http://localhost:8000/v1/rails/configs
          # Add more tests here if needed

      # Stop and remove the container
      - name: Stop and remove container
        run: |
          docker stop test_container
          docker rm test_container
