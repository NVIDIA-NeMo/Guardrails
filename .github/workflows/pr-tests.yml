name: PR Tests

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/docs-*.yml"

jobs:
  pr-tests-matrix:
    strategy:
      matrix:
        os: [Ubuntu]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: Ubuntu
            image: ubuntu-latest
          - python-version: "3.11"
            with-coverage: true
      fail-fast: false
    uses: ./.github/workflows/_test.yml
    with:
      os: ${{ matrix.os }}
      image: ${{ matrix.image }}
      python-version: ${{ matrix.python-version }}
      with-coverage: ${{ matrix.with-coverage || false }}
  pr-tests-summary:
    name: PR Tests Summary
    if: always()
    needs: pr-tests-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Check if tests ran
        if: needs.pr-tests-matrix.result == 'success'
        run: echo "All PR Tests completed successfully"
      - name: Check if tests were skipped
        if: needs.pr-tests-matrix.result == 'skipped'
        run: echo "Tests were skipped (docs-only changes)"
      - name: Fail if tests failed
        if: needs.pr-tests-matrix.result == 'failure'
        run: exit 1
