name: PR Tests

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".github/**"
      # `make test` collects neither the Rust crate nor integration_tests/: relay-plugin.yml and integration-tests.yml run them.
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "integration_tests/**"

permissions:
  contents: read

jobs:
  pr-tests-matrix:
    strategy:
      matrix:
        os: [Ubuntu]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: Ubuntu
            image: ubuntu-latest
      fail-fast: false
    uses: ./.github/workflows/_test.yml
    with:
      os: ${{ matrix.os }}
      image: ${{ matrix.image }}
      python-version: ${{ matrix.python-version }}
  pr-tests-summary:
    name: PR Tests Summary
    needs: pr-tests-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all PR tests passed
        run: echo "All PR Tests completed successfully"
