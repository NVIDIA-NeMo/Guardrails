name: PR Tests

# Runs on every pull request, so the required PR Tests Summary check always reports. The tests themselves run only when
# _code-changes.yml finds a change they depend on.
on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/_code-changes.yml
    permissions:
      pull-requests: read
  pr-tests-matrix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [Ubuntu]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: Ubuntu
            image: ubuntu-latest
      fail-fast: false
    uses: ./.github/workflows/_test.yml
    with:
      os: ${{ matrix.os }}
      image: ${{ matrix.image }}
      python-version: ${{ matrix.python-version }}
  # Without always(), a failed matrix would skip this job, and a skipped required check counts as passed.
  pr-tests-summary:
    name: PR Tests Summary
    needs: [changes, pr-tests-matrix]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR tests' result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          TESTS_RESULT: ${{ needs.pr-tests-matrix.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Couldn't tell whether the pull request needs tests: the changed-files job ended as $CHANGES_RESULT."
            exit 1
          fi
          if [ "$CODE_CHANGED" = "true" ]; then
            if [ "$TESTS_RESULT" != "success" ]; then
              echo "The PR tests didn't pass: $TESTS_RESULT."
              exit 1
            fi
            echo "All PR tests passed."
          elif [ "$CODE_CHANGED" = "false" ]; then
            if [ "$TESTS_RESULT" != "skipped" ]; then
              echo "The pull request needs no tests, but they ended as $TESTS_RESULT."
              exit 1
            fi
            echo "Tests skipped: the pull request changes nothing they depend on."
          else
            echo "The changed-files job gave no answer (code='$CODE_CHANGED')."
            exit 1
          fi
