name: Build and Test Distribution

on:
  # zizmor: ignore[cache-poisoning] -- this workflow has no pull_request
  # trigger; it runs only on push to main/develop/tags and on schedule, so the
  # restored .venv cache is only ever written by trusted refs (fork PRs cannot
  # write a cache these runs restore). The build env can influence the wheel,
  # so trigger scoping -- not the cache contents -- is what makes this safe.
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  schedule:
    - cron: "0 23 * * *" # 11:00 PM UTC, daily

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.11"
    outputs:
      artifact_name: ${{ steps.set-artifact-name.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: ./.github/actions/setup-uv

      - name: Make build script executable
        run: chmod +x ./.github/scripts/build.sh

      - name: Build Distributions
        id: build
        run: |
          ./.github/scripts/build.sh

      - name: Determine Tag Name
        id: get-tag-name
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set Artifact Name
        id: set-artifact-name
        run: |
          if [ -n "${STEPS_GET_TAG_NAME_OUTPUTS_TAG_NAME}" ]; then
            echo "artifact_name=${STEPS_GET_TAG_NAME_OUTPUTS_TAG_NAME}-build" >> $GITHUB_OUTPUT
          else
            echo "artifact_name=pr-build" >> $GITHUB_OUTPUT
          fi
        env:
          STEPS_GET_TAG_NAME_OUTPUTS_TAG_NAME: ${{ steps.get-tag-name.outputs.tag_name }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact_name }}
          path: dist/*

  test-wheel:
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-wheel.outputs.artifact_name }}

      - name: List Files
        run: ls -l

      - name: Install Wheel
        run: |
          pip install --upgrade pip
          WHEEL=$(ls nemoguardrails-*.whl)
          pip install "${WHEEL}[server]"

      - name: Start server in the background
        run: |
          nemoguardrails server &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      - name: Wait for server to be up
        run: |
          echo "Waiting for server to start..."
          for i in {1..30}; do
            RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/v1/rails/configs || true)
            if [ "$RESPONSE_CODE" = "200" ]; then
              echo "Server is up!"
              exit 0
            fi
            echo "Waiting..."
            sleep 1
          done
          echo "Server failed to start."
          exit 1

      - name: Stop server
        if: ${{ success() }}
        run: |
          kill $SERVER_PID
