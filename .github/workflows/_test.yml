name: Reusable Tests

on:
  workflow_call:
    inputs:
      os:
        description: "Operating system name"
        required: true
        default: Ubuntu
        type: string
      image:
        description: "Runner image"
        required: true
        default: ubuntu-latest
        type: string
      python-version:
        description: "Python version to test against"
        required: true
        default: "3.10"
        type: string
      upgrade-deps:
        description: "Whether to install all extras"
        required: false
        default: false
        type: boolean
      with-coverage:
        description: "Whether to run tests with coverage reporting"
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash
env:
  UV_VERSION: "0.11.17"

jobs:
  tests:
    name: ${{ inputs.os }} / Python ${{ inputs.python-version }}
    runs-on: ${{ inputs.image }}

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ inputs.python-version }}

      - name: Check lock file
        run: uv lock --check

      - name: Install dependencies
        run: |
          if [ "${{ inputs.upgrade-deps}}" = "true" ]; then
            uv lock --upgrade
            uv sync --locked --all-extras --group dev
          else
            uv sync --locked --group dev
          fi

      - name: Run pytest with coverage
        if: inputs.with-coverage
        env:
          # Enable the langchain-community provider drift canary only when
          # testing upgraded dependencies (the scheduled latest-deps job).
          LANGCHAIN_PROVIDER_DRIFT_CHECK: ${{ inputs.upgrade-deps && '1' || '' }}
        run: make test-coverage

      - name: Run pytest without coverage
        if: inputs.with-coverage == false
        env:
          # Enable the langchain-community provider drift canary only when
          # testing upgraded dependencies (the scheduled latest-deps job).
          LANGCHAIN_PROVIDER_DRIFT_CHECK: ${{ inputs.upgrade-deps && '1' || '' }}
        run: make test

      - name: Upload coverage to Codecov
        if: inputs.with-coverage
        uses: codecov/codecov-action@v7
        with:
          directory: ./coverage/reports/
          env_vars: PYTHON
          fail_ci_if_error: true
          files: ./coverage.xml
          flags: python
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
