name: Integration Tests

# The suites in integration_tests/, which `make test` doesn't collect. Each runs NeMo Guardrails against a real client
# with fake models behind it, so neither needs a secret or a model provider.

# Every change except documentation runs both suites. LICENSE.md comes back after the Markdown exclusion because
# package_bundle.py copies it into the plugin bundle, as it does LICENSE-Apache-2.0.txt.
on:
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!fern/**"
      - "LICENSE.md"
  push:
    branches:
      - develop
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!fern/**"
      - "LICENSE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  relay-plugin:
    name: NeMo Relay plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The suite's own environment needs Python 3.11; the hooks servers run from .venv.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: ./.github/actions/setup-uv
        with:
          cache-suffix: "3.11"

      # With no arguments, rustup installs the channel and components that rust-toolchain.toml pins.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      # Only develop saves the cache, so pull requests restore develop's and don't fill the repository's cache quota.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Run the packaging script's tests
        run: make test TEST=crates/nemo-guardrails-relay-plugin/scripts/test_package_bundle.py

      # The suite builds the plugin in release and packages it before its first test.
      - name: Run the NeMo Relay plugin tests
        run: make test-relay-plugin

  hooks-agents:
    name: Claude Code and Codex
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: ./.github/actions/setup-uv
        with:
          cache-suffix: "3.11"

      # Installs both agents from their hash-pinned wheels, then runs the suite in .venv.
      - name: Run the Claude Code and Codex tests
        run: make test-hooks-agents
