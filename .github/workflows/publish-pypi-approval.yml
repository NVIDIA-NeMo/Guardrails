name: Publish to PyPI (with Approval)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z, without v)"
        required: true
        type: string
      build_run_id:
        description: "Optional build run ID override; otherwise select automatically"
        required: false
        type: string
      validate_only:
        description: "Validate artifacts only; do not publish or create a release"
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: pypi-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.build.outputs.run_id }}
      artifact_id: ${{ steps.build.outputs.artifact_id }}
      sha: ${{ steps.build.outputs.sha }}
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate build provenance
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python .github/scripts/validate_pypi_release.py build

      - name: Download selected distributions
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.build.outputs.artifact_id }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.build.outputs.run_id }}

      - name: Validate distribution metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python .github/scripts/validate_pypi_release.py distributions

      - name: Summarize requested operation
        env:
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          if [ "$VALIDATE_ONLY" = "true" ]; then
            echo "Validation only: PyPI upload and GitHub release creation are skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Live publication requested: review the selected build before approving pypi-production." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-pypi:
    needs: validate
    if: ${{ !inputs.validate_only }}
    runs-on: ubuntu-latest
    environment:
      name: pypi-production
      url: https://pypi.org/project/nemoguardrails/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check release tag after approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: python .github/scripts/validate_pypi_release.py tag

      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate.outputs.run_id }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

  github-release:
    needs: [validate, publish-pypi]
    if: ${{ !inputs.validate_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Create GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          awk -v version="$RELEASE_VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" version "]")) {
                found=1
                next
              }
            }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release_notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release_notes.md"
