name: Skip PR Tests

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/**"
      # `make test` collects neither the Rust crate nor integration_tests/: relay-plugin.yml and integration-tests.yml run them.
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "integration_tests/**"

permissions: {}

jobs:
  pr-tests-summary:
    name: PR Tests Summary
    runs-on: ubuntu-latest
    steps:
      - run: echo "Tests skipped (no code changes)"
  pr-coverage-summary:
    name: PR Coverage Summary
    runs-on: ubuntu-latest
    steps:
      - run: echo "Coverage skipped (no code changes)"
