name: Full Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested, ready_for_review]
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-tests-matrix:
    strategy:
      matrix:
        os: [Windows, macOS] # exclude Ubuntu as it is available in pr-tests
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: Windows
            image: windows-2022
          - os: macOS
            image: macos-14
      fail-fast: false

    uses: ./.github/workflows/_test.yml
    with:
      os: ${{ matrix.os }}
      image: ${{ matrix.image }}
      python-version: ${{ matrix.python-version }}
  full-tests-summary:
    name: Full Tests Summary
    needs: full-tests-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Full Tests Completion
        env:
          MATRIX_RESULT: ${{ needs.full-tests-matrix.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Full test matrix did not pass: $MATRIX_RESULT"
            exit 1
          fi
          echo "Full tests completed. All matrix jobs passed."
