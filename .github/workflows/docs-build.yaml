name: docs-build

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize]
    paths:
      - ".github/workflows/docs-build.yaml"
      - "Makefile"
      - "docs/**"
      - "fern/**"
      - "scripts/normalize-fern-sdk-reference.mjs"
      - "scripts/watch-fern-preview.mjs"
      - "scripts/fix-empty-fern-links.mjs"
  push:
    branches: [develop]
    tags:
      - docs-v*
      - v*
    paths:
      - ".github/workflows/docs-build.yaml"
      - "Makefile"
      - "docs/**"
      - "fern/**"
      - "scripts/normalize-fern-sdk-reference.mjs"
      - "scripts/watch-fern-preview.mjs"
      - "scripts/fix-empty-fern-links.mjs"
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Check Fern docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check Fern docs
        run: make docs-fern-strict
