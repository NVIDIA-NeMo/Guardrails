# Scenario: Code Generation — low-concurrency sweep (c=1, c=2)
# Extended benchmark_duration (1200s) ensures ~200+ responses per run at these
# concurrency levels given code_gen's long output length (2000 tokens).
# High-concurrency sweep (c=4+) is in scenario_code_gen_sweep.yaml.
#
# Run (LLMRails): python -m benchmark.aiperf --config-file benchmark/aiperf/configs/scenario_code_gen_lowc_sweep.yaml
# Run (IORails):  NEMO_GUARDRAILS_IORAILS_ENGINE=1 python -m benchmark.aiperf --config-file benchmark/aiperf/configs/scenario_code_gen_lowc_sweep.yaml

batch_name: scenario_code_gen_lowc

output_base_dir: aiperf_results

base_config:
  model: nvidia/nemotron-3-nano        # Override per main model under test
  tokenizer: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4  # Match model above
  url: "http://localhost:9000"
  health_check_endpoint: "/v1/rails/configs"
  endpoint: "/v1/chat/completions"
  endpoint_type: chat

  warmup_request_count: 10
  benchmark_duration: 1200
  concurrency: 0          # Overridden by sweep
  request_rate_mode: "constant"

  use_legacy_max_tokens: true

  input_file: benchmark/datasets/code_gen.jsonl
  custom_dataset_type: single_turn

  # Synthetic data generation (disabled in favor of real data above)
  # random_seed: 12345
  # prompt_input_tokens_mean: 200
  # prompt_input_tokens_stddev: 10
  # prompt_output_tokens_mean: 2000
  # prompt_output_tokens_stddev: 10

sweeps:
  concurrency: [1, 2]
