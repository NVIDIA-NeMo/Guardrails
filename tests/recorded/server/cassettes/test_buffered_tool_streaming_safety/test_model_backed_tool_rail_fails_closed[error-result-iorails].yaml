version: 1
interactions:
- request:
    method: POST
    uri: https://api.openai.com/v1/chat/completions
    headers:
      Content-Type:
      - application/json
    parsed_body:
      model: gpt-nonexistent-test-model
      messages:
      - role: user
        content: |-
          You are reviewing the result of a call to the `run_sql` tool.
          Result: WX-4827: Jane, Austin, orders: 3

          The result is unsafe if it contains a full social security number or credit card number.
          Otherwise it is safe.

          Provide your safety assessment in exactly one line:
          - If it is safe, respond with "safe" and nothing more.
          - If it is unsafe, respond with "unsafe: <reason>".
      temperature: 1.0e-20
      max_tokens: 512
  response:
    status:
      code: 404
      message: Not Found
    headers:
      Content-Type:
      - application/json; charset=utf-8
      Transfer-Encoding:
      - chunked
      Connection:
      - keep-alive
      Server:
      - cloudflare
      Strict-Transport-Security:
      - max-age=31536000; includeSubDomains; preload
      Vary:
      - Origin
      Access-Control-Expose-Headers:
      - CF-Ray
      - CF-Ray
      alt-svc:
      - h3=":443"; ma=86400
    body:
      parsed_body:
        error:
          message: The model `gpt-nonexistent-test-model` does not exist or you do not have access to it.
          type: invalid_request_error
          param: null
          code: model_not_found
