version: 1
interactions:
- request:
    method: POST
    uri: https://api.openai.com/v1/chat/completions
    headers:
      Content-Type:
      - application/json
    parsed_body:
      model: gpt-nonexistent-test-model
      messages:
      - role: user
        content: Get Paris weather.
      - role: assistant
        tool_calls:
        - id: call_weather
          type: function
          function:
            name: get_weather
            arguments: '{"city":"Paris"}'
      - role: tool
        tool_call_id: call_weather
        content: 'WX-4827: sunny'
      tools:
      - type: function
        function:
          name: get_weather
          description: Get the current weather for a city.
          parameters:
            type: object
            properties:
              city:
                type: string
            required:
            - city
            additionalProperties: false
      tool_choice: none
  response:
    status:
      code: 404
      message: Not Found
    headers:
      Content-Type:
      - application/json; charset=utf-8
      Transfer-Encoding:
      - chunked
      Connection:
      - keep-alive
      Server:
      - cloudflare
      Strict-Transport-Security:
      - max-age=31536000; includeSubDomains; preload
      Vary:
      - Origin
      Access-Control-Expose-Headers:
      - CF-Ray
      - CF-Ray
      alt-svc:
      - h3=":443"; ma=86400
    body:
      parsed_body:
        error:
          message: The model `gpt-nonexistent-test-model` does not exist or you do not have access to it.
          type: invalid_request_error
          param: null
          code: model_not_found
