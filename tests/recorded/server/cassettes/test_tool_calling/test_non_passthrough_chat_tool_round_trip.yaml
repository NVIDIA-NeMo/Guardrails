          text based on the input that it receives. The bot is talkative and provides lots of specific details. If the bot
          does not know the answer to a question, it truthfully says it does not know.
      - role: user
        content: Look up the weather in Paris, then quote the tool result exactly.
      tools:
      - type: function
        function:
          name: get_weather
          description: Look up the current weather in a city.
          parameters:
            type: object
            properties:
              city:
                type: string
                enum:
                - Paris
            required:
            - city
            additionalProperties: false
      tool_choice: required
      parallel_tool_calls: false
  response:
