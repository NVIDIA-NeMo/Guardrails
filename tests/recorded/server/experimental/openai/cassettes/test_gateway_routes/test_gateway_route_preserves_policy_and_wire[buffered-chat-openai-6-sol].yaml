version: 1
interactions:
- request:
    method: POST
    uri: https://inference-api.nvidia.com/v1/chat/completions
    headers:
      host:
      - inference-api.nvidia.com
      accept:
      - '*/*'
      connection:
      - keep-alive
      user-agent:
      - python-httpx/0.28.1
      accept-encoding:
      - identity
      content-type:
      - application/json
    parsed_body:
      model: openai/openai/gpt-6-sol
      stream: false
      messages:
      - role: user
        content: 'Reply with exactly: Hello.'
      max_completion_tokens: 1024
      reasoning_effort: low
  response:
    status:
      code: 200
      message: OK
    headers:
      content-type:
      - application/json
      content-security-policy:
      - frame-ancestors 'none'
      vary:
      - Accept-Encoding
    body:
      parsed_body:
        id: '[RECORDED_RESPONSE_ID]'
        created: 0
        model: openai/openai/gpt-6-sol
        object: chat.completion
        choices:
        - finish_reason: stop
          index: 0
          message:
            content: Hello.
            role: assistant
        usage:
          completion_tokens: 6
          prompt_tokens: 12
          total_tokens: 18
          completion_tokens_details:
            reasoning_tokens: 0
          prompt_tokens_details:
            cached_tokens: 0
            cache_write_tokens: 0
            cache_creation_tokens: 0
        access_programs:
          cyber: daybreak_blue
        billing:
          payer: developer
        frequency_penalty: 0.0
        presence_penalty: 0.0
        service_tier: default
        tool_usage:
          image_gen:
            input_tokens: 0
            input_tokens_details:
              image_tokens: 0
              text_tokens: 0
            output_tokens: 0
            output_tokens_details:
              image_tokens: 0
              text_tokens: 0
            total_tokens: 0
          web_search:
            num_requests: 0
