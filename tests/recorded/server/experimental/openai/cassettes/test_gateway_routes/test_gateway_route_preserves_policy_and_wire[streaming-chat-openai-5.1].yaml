version: 1
interactions:
- request:
    method: POST
    uri: https://inference-api.nvidia.com/v1/chat/completions
    headers:
      host:
      - inference-api.nvidia.com
      accept:
      - '*/*'
      connection:
      - keep-alive
      user-agent:
      - python-httpx/0.28.1
      accept-encoding:
      - identity
      content-type:
      - application/json
    parsed_body:
      model: openai/openai/gpt-5.1
      stream: true
      messages:
      - role: user
        content: 'Reply with exactly: Hello.'
      max_completion_tokens: 1024
      stream_options:
        include_usage: true
      reasoning_effort: low
  response:
    status:
      code: 200
      message: OK
    headers:
      cache-control:
      - no-cache
      content-type:
      - text/event-stream; charset=utf-8
      content-security-policy:
      - frame-ancestors 'none'
      transfer-encoding:
      - chunked
    body:
      parsed_body:
      - id: '[RECORDED_RESPONSE_ID]'
        object: chat.completion.chunk
        created: 0
        model: openai/openai/gpt-5.1
        service_tier: default
        choices:
        - index: 0
          delta:
            role: assistant
            content: ''
      - id: '[RECORDED_RESPONSE_ID]'
        object: chat.completion.chunk
        created: 0
        model: openai/openai/gpt-5.1
        service_tier: default
        choices:
        - index: 0
          delta:
            content: Hello
      - id: '[RECORDED_RESPONSE_ID]'
        object: chat.completion.chunk
        created: 0
        model: openai/openai/gpt-5.1
        service_tier: default
        choices:
        - index: 0
          delta:
            content: .
      - id: '[RECORDED_RESPONSE_ID]'
        object: chat.completion.chunk
        created: 0
        model: openai/openai/gpt-5.1
        service_tier: default
        choices:
        - index: 0
          delta: {}
          finish_reason: stop
      - id: '[RECORDED_RESPONSE_ID]'
        created: 0
        model: openai/openai/gpt-5.1
        object: chat.completion.chunk
        choices:
        - index: 0
          delta: {}
        usage:
          completion_tokens: 17
          prompt_tokens: 12
          total_tokens: 29
          completion_tokens_details:
            accepted_prediction_tokens: 0
            audio_tokens: 0
            reasoning_tokens: 6
            rejected_prediction_tokens: 0
          prompt_tokens_details:
            audio_tokens: 0
            cached_tokens: 0
          cost: 0.00013579
        service_tier: default
      - '[DONE]'
