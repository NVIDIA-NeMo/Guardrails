version: 1
interactions:
- request:
    method: POST
    uri: https://inference-api.nvidia.com/v1/chat/completions
    headers:
      content-type:
      - application/json
    parsed_body:
      model: openai/openai/gpt-5-nano
      stream: true
      messages:
      - role: user
        content: 'Reply with exactly: Hello.'
      max_completion_tokens: 256
      stream_options:
        include_usage: true
      reasoning_effort: minimal
  response:
    status:
      code: 200
      message: OK
    headers:
      content-type:
      - text/event-stream; charset=utf-8
    body:
      parsed_body:
      - id: '[RECORDED_RESPONSE_ID]'
        object: chat.completion.chunk
        created: 0
        model: openai/openai/gpt-5-nano
        service_tier: default
        choices:
        - index: 0
          delta:
            role: assistant
            content: ''
      - id: '[RECORDED_RESPONSE_ID]'
        object: chat.completion.chunk
        created: 0
        model: openai/openai/gpt-5-nano
        service_tier: default
        choices:
        - index: 0
          delta:
            content: Hello
      - id: '[RECORDED_RESPONSE_ID]'
        object: chat.completion.chunk
        created: 0
        model: openai/openai/gpt-5-nano
        service_tier: default
        choices:
        - index: 0
          delta:
            content: .
      - id: '[RECORDED_RESPONSE_ID]'
        object: chat.completion.chunk
        created: 0
        model: openai/openai/gpt-5-nano
        service_tier: default
        choices:
        - index: 0
          delta: {}
          finish_reason: stop
      - id: '[RECORDED_RESPONSE_ID]'
        created: 0
        model: openai/openai/gpt-5-nano
        object: chat.completion.chunk
        choices:
        - index: 0
          delta: {}
        usage:
          completion_tokens: 11
          prompt_tokens: 12
          total_tokens: 23
          completion_tokens_details:
            accepted_prediction_tokens: 0
            audio_tokens: 0
            reasoning_tokens: 0
            rejected_prediction_tokens: 0
          prompt_tokens_details:
            audio_tokens: 0
            cached_tokens: 0
          cost: 3.6700000000000004e-06
        service_tier: default
      - '[DONE]'
