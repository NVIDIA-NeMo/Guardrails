version: 1
interactions:
- request:
    method: POST
    uri: https://api.openai.com/v1/responses
    headers:
      host:
      - api.openai.com
      accept:
      - '*/*'
      connection:
      - keep-alive
      user-agent:
      - python-httpx/0.28.1
      accept-encoding:
      - identity
      content-type:
      - application/json
    parsed_body:
      model: recorded-invalid-responses-model
      input: 'Reply with exactly: Hello, recorded Responses!'
      stream: false
      store: false
      max_output_tokens: 256
      reasoning:
        effort: minimal
      metadata:
        test: native-responses
  response:
    status:
      code: 404
      message: Not Found
    headers:
      content-type:
      - application/json
      connection:
      - keep-alive
      server:
      - cloudflare
      strict-transport-security:
      - max-age=31536000; includeSubDomains; preload
      access-control-expose-headers:
      - X-Request-ID
      - CF-Ray
      - CF-Ray
      alt-svc:
      - h3=":443"; ma=86400
    body:
      parsed_body:
        error:
          message: The model `recorded-invalid-responses-model` does not exist or you do not have access to it.
          type: invalid_request_error
          param: null
          code: model_not_found
