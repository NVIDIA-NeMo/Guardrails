version: 1
interactions:
- request:
    method: POST
    uri: https://api.openai.com/v1/chat/completions
    headers:
      host:
      - api.openai.com
      accept:
      - '*/*'
      connection:
      - keep-alive
      user-agent:
      - python-httpx/0.28.1
      accept-encoding:
      - identity
      content-type:
      - application/json
    parsed_body:
      model: gpt-4o-mini
      stream: true
      store: false
      messages:
      - role: user
        content: 'Reply with exactly: Hello.'
      max_completion_tokens: 256
      stream_options:
        include_usage: true
  response:
    status:
      code: 200
      message: OK
    headers:
      content-type:
      - text/event-stream; charset=utf-8
      transfer-encoding:
      - chunked
      connection:
      - keep-alive
      server:
      - cloudflare
      strict-transport-security:
      - max-age=31536000; includeSubDomains; preload
      access-control-expose-headers:
      - X-Request-ID
      - CF-Ray
      - CF-Ray
      alt-svc:
      - h3=":443"; ma=86400
    body:
      parsed_body:
      - id: '[RECORDED_RESPONSE_ID]'
