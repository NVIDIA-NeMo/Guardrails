version: 1
interactions:
- request:
    method: POST
    uri: https://inference-api.nvidia.com/v1/chat/completions
    headers:
      host:
      - inference-api.nvidia.com
      connection:
      - keep-alive
      accept:
      - '*/*'
      user-agent:
      - python-httpx/0.28.1
      content-type:
      - application/json
      accept-encoding:
      - identity
    parsed_body:
      model: openai/openai/gpt-5-nano
      messages:
      - role: user
        content: Give a one-sentence greeting for a coworker.
      temperature: 0.7
      max_tokens: 1024
      n: 1
      stream: true
      stream_options:
        include_usage: true
  response:
