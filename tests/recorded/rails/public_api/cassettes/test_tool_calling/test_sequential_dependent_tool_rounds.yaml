version: 1
interactions:
- request:
    method: POST
    uri: https://api.openai.com/v1/chat/completions
    headers:
      host:
      - api.openai.com
      accept:
      - '*/*'
      accept-encoding:
      - gzip, deflate, zstd
      connection:
      - keep-alive
      user-agent:
      - python-httpx/0.28.1
      content-type:
      - application/json
    parsed_body:
      model: gpt-5.4-nano
      messages:
      - role: user
        content: |-
          Below is a conversation between a helpful AI assistant and a user. The bot is designed to generate human-like text based on the input that it receives. The bot is talkative and provides lots of specific details. If the bot does not know the answer to a question, it truthfully says it does not know.

          User: Get the Paris weather, pass its weather_token to get_advice, then quote both tool results exactly.
          Assistant:
      tools:
      - type: function
        function:
          name: get_weather
          parameters:
            type: object
            properties:
              city:
                type: string
                enum:
                - Paris
            required:
            - city
            additionalProperties: false
      - type: function
        function:
          name: get_advice
          parameters:
            type: object
            properties:
              weather_token:
                type: string
            required:
            - weather_token
            additionalProperties: false
      tool_choice:
        type: function
        function:
          name: get_weather
      parallel_tool_calls: false
  response:
    status:
      code: 200
      message: OK
    headers:
      content-type:
      - application/json
      transfer-encoding:
      - chunked
      connection:
      - keep-alive
      server:
      - cloudflare
      strict-transport-security:
      - max-age=31536000; includeSubDomains; preload
      access-control-expose-headers:
      - X-Request-ID
      - CF-Ray
      - CF-Ray
      alt-svc:
      - h3=":443"; ma=86400
    body:
      parsed_body:
        id: '[RECORDED_RESPONSE_ID]'
        object: chat.completion
        created: 0
        model: gpt-5.4-nano-2026-03-17
        choices:
