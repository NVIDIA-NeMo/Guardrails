          message:
            role: assistant
            content: null
            tool_calls:
            - id: call_a7OunQMdySJjyeikWcTAnqWM
              type: function
              function:
                name: get_weather
                arguments: '{"city":"Paris"}'
            refusal: null
            annotations: []
          finish_reason: tool_calls
        usage:
