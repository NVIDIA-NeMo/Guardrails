version: 1
interactions:
- request:
    method: POST
    uri: https://inference-api.nvidia.com/v1/chat/completions
    headers:
      host:
      - inference-api.nvidia.com
      accept:
      - '*/*'
      accept-encoding:
      - gzip, deflate, zstd
      connection:
      - keep-alive
      user-agent:
      - python-httpx/0.28.1
      content-type:
      - application/json
    parsed_body:
      model: nvidia/nvidia/nemotron-3-nano-30b-a3b
      messages:
      - role: user
        content: Call get_weather for Paris. Do not answer in prose.
      stream: true
      stream_options:
        include_usage: true
      tools:
