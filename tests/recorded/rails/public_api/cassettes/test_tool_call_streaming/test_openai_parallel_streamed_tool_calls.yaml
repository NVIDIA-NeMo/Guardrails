version: 1
interactions:
- request:
    method: POST
    uri: https://api.openai.com/v1/chat/completions
    headers:
      host:
      - api.openai.com
      accept:
      - '*/*'
      accept-encoding:
      - gzip, deflate, zstd
      connection:
      - keep-alive
      user-agent:
      - python-httpx/0.28.1
      content-type:
      - application/json
    parsed_body:
      model: gpt-5.4-nano
      messages:
      - role: user
        content: Call get_weather once for Paris and once for Boston. Do not answer in prose.
      stream: true
      stream_options:
        include_usage: true
      tools:
      - type: function
        function:
          name: get_weather
          description: Get the current weather for a city.
          parameters:
            type: object
            properties:
              city:
                type: string
            required:
            - city
            additionalProperties: false
      tool_choice: required
      parallel_tool_calls: true
      max_completion_tokens: 1024
