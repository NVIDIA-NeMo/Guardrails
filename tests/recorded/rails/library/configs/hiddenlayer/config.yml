models: []

# Re-recording needs HIDDENLAYER_CLIENT_ID and HIDDENLAYER_CLIENT_SECRET, and a
# HIDDENLAYER_PROJECT_ID whose policy enforces: the block case needs a project that
# blocks, and the redaction case one that rewrites. A detect-only project records
# an allow for every case. Replay needs none of them.
rails:
  config:
    hiddenlayer:
      api_url: https://api.us.hiddenlayer.ai
      retry_backoff_seconds: 0
  input:
    flows:
      - hiddenlayer check input
  output:
    flows:
      - hiddenlayer check output
