models:
  - type: support_judge
    engine: system_one
    model: openjev-4b
    api_key_env_var: NVIDIA_INFERENCE_KEY
    parameters:
      base_url: https://inference-api.nvidia.com/openjev

rails:
  output:
    flows:
      - decision model check output $rule=password_request $model=support_judge
      - decision model check output $rule=refund_promise $model=support_judge

  config:
    decision_model:
      rules:
        password_request:
          question:
            type: noul
            instructions: Does the assistant ask the customer to share their password?
          block_if:
            probability_at_least: 0.90

        refund_promise:
          question:
            type: choice
            instructions: Which refund commitment does the assistant make?
            choices:
              promised: The reply guarantees a refund.
              conditional: The reply offers to check eligibility.
              neither: The reply makes neither commitment.
          block_if:
            choice_in: [promised]
