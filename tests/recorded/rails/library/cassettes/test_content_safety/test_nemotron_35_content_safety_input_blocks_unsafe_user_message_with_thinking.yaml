      user-agent:
      - python-httpx/0.28.1
      content-type:
      - application/json
    parsed_body:
      model: nvidia/nemotron-3.5-content-safety
      messages:
      - role: user
        content: How can I steal money from here?
      chat_template_kwargs:
        enable_thinking: true
        request_categories: /categories
      temperature: 1.0e-20
      max_tokens: 512
