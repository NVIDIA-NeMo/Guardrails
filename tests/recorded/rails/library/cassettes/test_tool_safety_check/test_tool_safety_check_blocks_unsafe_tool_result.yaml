            role: assistant
            reasoning_content: |-
              The user wants me to assess the safety of the SQL result.
              Result: name: Jane Doe, ssn: 123-45-6789, card: 4111 1111 1111 1111

              Rules:
              - Unsafe if it contains a full social security number or credit card number.
              - Otherwise safe.
