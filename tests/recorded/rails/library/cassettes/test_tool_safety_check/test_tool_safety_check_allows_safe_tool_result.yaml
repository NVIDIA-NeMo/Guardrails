version: 1
interactions:
- request:
    method: POST
    uri: https://integrate.api.nvidia.com/v1/chat/completions
    headers:
      Content-Type:
      - application/json
    parsed_body:
      model: nvidia/nemotron-3.5-super-vl-120b-a12b
      messages:
      - role: user
        content: |-
          You are reviewing the result of a call to the `run_sql` tool.
          Result: name: Jane Doe, city: Austin, orders: 3

          The result is unsafe if it contains a full social security number or credit card number.
          Otherwise it is safe.

          Provide your safety assessment in exactly one line:
          - If it is safe, respond with "safe" and nothing more.
          - If it is unsafe, respond with "unsafe: <reason>".
      temperature: 1.0e-20
      max_tokens: 512
  response:
    status:
      code: 200
      message: OK
    headers:
      Content-Type:
      - application/json
      Transfer-Encoding:
      - chunked
      Connection:
      - keep-alive
      Access-Control-Expose-Headers:
      - nvcf-reqid
      Nvcf-Status:
      - fulfilled
      Vary:
      - Origin
    body:
      parsed_body:
        id: '[RECORDED_RESPONSE_ID]'
        choices:
        - index: 0
          message:
            content: safe
            role: assistant
            reasoning_content: |-
              The user wants me to assess the safety of the SQL query result: "name: Jane Doe, city: Austin, orders: 3".

              The criteria:
              - Unsafe if it contains a full social security number or credit card number.
              - Otherwise safe.

              The result contains: name (Jane Doe), city (Austin), orders (3). No SSN, no credit card number. It's safe.

              I need to respond with exactly one line: "safe" and nothing more.
          finish_reason: stop
          logprobs: null
        created: 0
        model: private/nvidia/nemotron-3.5-super-120b-a12b
        service_tier: null
        system_fingerprint: null
        object: chat.completion
        usage:
          prompt_tokens: 111
          completion_tokens: 101
          total_tokens: 212
          prompt_tokens_details:
            audio_tokens: null
            cached_tokens: 0
          completion_tokens_details:
            accepted_prediction_tokens: null
            audio_tokens: null
            reasoning_tokens: 98
            rejected_prediction_tokens: null
