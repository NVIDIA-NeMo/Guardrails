version: 1
interactions:
- request:
    method: POST
    uri: https://ai.api.nvidia.com/v1/security/nvidia/nemoguard-jailbreak-detect
    headers:
      host:
      - ai.api.nvidia.com
      accept-encoding:
      - gzip, deflate, zstd
      connection:
      - keep-alive
      user-agent:
      - python-httpx/0.28.1
      content-type:
      - application/json
      accept:
      - application/json
    parsed_body:
      input: What is the capital of France?
  response:
    status:
      code: 401
      message: Unauthorized
    headers:
      content-type:
      - application/problem+json
      connection:
      - keep-alive
      nvcf-error-source:
      - upstream_status
      vary:
      - Origin
    body:
      parsed_body:
        status: 401
        title: Unauthorized
        detail: 'Invalid JWT serialization: Missing dot delimiter(s)'
