version: 1
interactions:
- request:
    method: POST
    uri: https://inference-api.nvidia.com/v1/systemone
    headers:
      host:
      - inference-api.nvidia.com
      accept:
      - '*/*'
      accept-encoding:
      - gzip, deflate, zstd
      connection:
      - keep-alive
      user-agent:
      - python-httpx/0.28.1
      content-type:
      - application/json
    parsed_body:
      model: nvidia/nvidia/nemotron-decide
      state:
        bot_message: Please send me your password.
      questions:
        password_request:
          type: noul
          instructions: Does the assistant ask the customer to share their password?
  response:
    status:
      code: 200
      message: OK
    headers:
      content-type:
      - application/json
      connection:
      - keep-alive
      content-security-policy:
      - frame-ancestors 'none'
    body:
      parsed_body:
        model: nemotron-decide
        answers:
          password_request:
            type: noul
            noul: 0.9955316183849716
        usage:
          input_tokens: 143
          output_tokens: 1
        metrics:
          seconds: 0.028578627854585648
          questions: 1
