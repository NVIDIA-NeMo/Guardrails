      - keep-alive
      vary:
      - origin, access-control-request-method, access-control-request-headers
      access-control-allow-origin:
      - '*'
      access-control-expose-headers:
      - x-request-id,retry-after,server-timing-total
      - CF-Ray
      server-timing-total:
      - '199.280'
      server:
      - cloudflare
      strict-transport-security:
      - max-age=31536000; includeSubDomains; preload
      alt-svc:
      - h3=":443"; ma=86400
    body:
      parsed_body:
        model: gpt-6-luna
        answers:
        - type: predicate
          name: password_request
          probability: 0.0
        usage:
          input_tokens: 171
