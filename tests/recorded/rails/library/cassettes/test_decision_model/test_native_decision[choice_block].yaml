      content-type:
      - application/json
    parsed_body:
      model: gpt-6-luna
      input:
      - role: user
        content:
        - type: input_json
          data:
            bot_message: You are guaranteed a full refund.
      questions:
      - name: password_request
        type: predicate
        instructions: Does the assistant ask the customer to share their password?
