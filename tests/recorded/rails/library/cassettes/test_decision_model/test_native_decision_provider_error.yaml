version: 1
interactions:
- request:
    method: POST
    uri: https://api.openai.com/v1/decisions
    headers:
      host:
      - api.openai.com
      accept:
      - '*/*'
      accept-encoding:
      - gzip, deflate, zstd
      connection:
      - keep-alive
      user-agent:
      - python-httpx/0.28.1
      content-type:
      - application/json
    parsed_body:
      model: gpt-6-luna
      input:
      - role: user
        content:
        - type: input_json
          data:
            bot_message: I can check eligibility.
      questions:
      - name: password_request
        type: predicate
        instructions: Does the assistant ask the customer to share their password?
  response:
    status:
      code: 401
      message: Unauthorized
    headers:
      content-type:
      - text/plain; charset=utf-8
      connection:
      - keep-alive
      access-control-expose-headers:
      - CF-Ray
      strict-transport-security:
      - max-age=31536000; includeSubDomains; preload
      server:
      - cloudflare
      alt-svc:
      - h3=":443"; ma=86400
    body:
      string: Identity Edge route authentication policy requires an accepted credential
