paths:
  /chat/completions:
    get:
      operationId: listChatCompletions
      parameters:
      - name: model
        in: query
        required: false
        schema:
          type: string
      - name: metadata
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Metadata'
      - name: after
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        '200':
          description: A list of Chat Completions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionList'
        '400':
          description: Invalid pagination or filter parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: An internal error prevented the request from being completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatCompletionRequest'
      responses:
        '200':
          description: 'Returns a Chat Completion object for a non-streaming request.


            If `stream` is `true`, returns server-sent events (`text/event-stream`).

            Successful chunk frames contain a JSON Chat Completion chunk matching

            `CreateChatCompletionStreamResponse`. On normal completion, the final

            frame is:


            ```text

            data: [DONE]


            ```


            The final frame ends with a blank line. `[DONE]` is literal text, not
            a

            JSON chunk, and this frame has no `event: done` field.


            If a failure occurs after streaming has started, a data frame may

            contain a JSON object with an `error` field instead of a completion

            chunk. The streaming schema describes successful JSON chunks, not

            error frames or the completion marker. An interrupted stream may end

            without the marker.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChatCompletionResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/CreateChatCompletionStreamResponse'
        '400':
          description: Invalid chat completion request or incompatible request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed because the API key is missing or revoked,
            or the client IP is not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/plain:
              schema:
                type: string
        '403':
          description: Access to a personal API organization is blocked by the organization
            policy.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: The requested model or a referenced resource was not found
            or is unavailable to this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/InferenceRateLimited'
        '500':
          description: The chat completion could not be processed due to an internal
            error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/InferenceServiceUnavailable'
  /chat/completions/{completion_id}:
    get:
      operationId: getChatCompletion
      parameters:
      - in: path
        name: completion_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A chat completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChatCompletionResponse'
        '404':
          description: No stored chat completion was found with the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: An internal error prevented the request from being completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: updateChatCompletion
      parameters:
      - in: path
        name: completion_id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - metadata
              properties:
                metadata:
                  $ref: '#/components/schemas/Metadata'
      responses:
        '200':
          description: A chat completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChatCompletionResponse'
        '400':
          description: Invalid metadata update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No stored chat completion was found with the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: An internal error prevented the request from being completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteChatCompletion
      parameters:
      - in: path
        name: completion_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The chat completion was deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionDeleted'
        '404':
          description: No stored chat completion was found with the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: An internal error prevented the request from being completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /chat/completions/{completion_id}/messages:
    get:
      operationId: getChatCompletionMessages
      parameters:
      - in: path
        name: completion_id
        required: true
        schema:
          type: string
      - name: after
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        '200':
          description: A list of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionMessageList'
        '400':
          description: Invalid message pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No stored chat completion was found with the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: An internal error prevented the request from being completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ChatCompletionAllowedTools:
      type: object
      properties:
        mode:
          type: string
          enum:
          - auto
          - required
        tools:
          type: array
          items:
            type: object
            x-oaiExpandable: false
            additionalProperties: true
      required:
      - mode
      - tools
    ChatCompletionAllowedToolsChoice:
      type: object
      properties:
        type:
          type: string
          enum:
          - allowed_tools
          x-stainless-const: true
        allowed_tools:
          $ref: '#/components/schemas/ChatCompletionAllowedTools'
      required:
      - type
      - allowed_tools
    ChatCompletionDeleted:
      type: object
      properties:
        object:
          type: string
          enum:
          - chat.completion.deleted
          x-stainless-const: true
        id:
          type: string
        deleted:
          type: boolean
      required:
      - object
      - id
      - deleted
    ChatCompletionFunctionCallOption:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    ChatCompletionFunctions:
      type: object
      deprecated: true
      properties:
        description:
          type: string
        name:
          type: string
        parameters:
          $ref: '#/components/schemas/FunctionParameters'
      required:
      - name
    ChatCompletionList:
      type: object
      properties:
        object:
          type: string
          enum:
          - list
          default: list
          x-stainless-const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/CreateChatCompletionResponse'
        first_id:
          type:
          - string
          - 'null'
        last_id:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
      required:
      - object
      - data
      - first_id
      - last_id
      - has_more
    ChatCompletionMessageCustomToolCall:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - custom
          x-stainless-const: true
        custom:
          type: object
          properties:
            name:
              type: string
            input:
              type: string
          required:
          - name
          - input
      required:
      - id
      - type
      - custom
    ChatCompletionMessageList:
      type: object
      properties:
        object:
          type: string
          enum:
          - list
          default: list
          x-stainless-const: true
        data:
          type: array
          items:
            properties:
              id:
                type: string
              role:
                enum:
                - user
                - assistant
                - tool
                - system
                - function
                - developer
                type: string
              content:
                anyOf:
                - type: string
                - type: 'null'
              content_parts:
                anyOf:
                - items:
                    properties:
                      type:
                        enum:
                        - text
                        - image_url
                        - input_audio
                        - file
                        type: string
                      text:
                        anyOf:
                        - type: string
                        - type: 'null'
                      image_url:
                        anyOf:
                        - properties:
                            url:
                              type: string
                            detail:
                              anyOf:
                              - type: string
                              - type: 'null'
                          required:
                          - url
                          type: object
                        - type: 'null'
                      input_audio:
                        anyOf:
                        - properties:
                            data:
                              type: string
                            format:
                              type: string
                          required:
                          - data
                          - format
                          type: object
                        - type: 'null'
                      file:
                        anyOf:
                        - properties:
                            file_data:
                              anyOf:
                              - type: string
                              - type: 'null'
                            filename:
                              anyOf:
                              - type: string
                              - type: 'null'
                            file_id:
                              anyOf:
                              - type: string
                              - type: 'null'
                          type: object
                        - type: 'null'
                    required:
                    - type
                    type: object
                  type: array
                - type: 'null'
              name:
                anyOf:
                - type: string
                - type: 'null'
            required:
            - id
            - role
            - content
            - content_parts
            type: object
        first_id:
          type:
          - string
          - 'null'
        last_id:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
      required:
      - object
      - data
      - first_id
      - last_id
      - has_more
    ChatCompletionMessageToolCall:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - function
          x-stainless-const: true
        function:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string
          required:
          - name
          - arguments
      required:
      - id
      - type
      - function
    ChatCompletionMessageToolCallChunk:
      type: object
      properties:
        index:
          type: integer
        id:
          type: string
        type:
          type: string
          enum:
          - function
          x-stainless-const: true
        function:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string
      required:
      - index
    ChatCompletionMessageToolCalls:
      type: array
      items:
        oneOf:
        - $ref: '#/components/schemas/ChatCompletionMessageToolCall'
        - $ref: '#/components/schemas/ChatCompletionMessageCustomToolCall'
        discriminator:
          propertyName: type
    ChatCompletionModeration:
      type: object
      properties:
        input:
          oneOf:
          - $ref: '#/components/schemas/ChatCompletionModerationResults'
          - $ref: '#/components/schemas/ChatCompletionModerationError'
          discriminator:
            propertyName: type
        output:
          oneOf:
          - $ref: '#/components/schemas/ChatCompletionModerationResults'
          - $ref: '#/components/schemas/ChatCompletionModerationError'
          discriminator:
            propertyName: type
      required:
      - input
      - output
    ChatCompletionModerationError:
      type: object
      properties:
        type:
          type: string
          enum:
          - error
          x-stainless-const: true
        code:
          type: string
        message:
          type: string
      required:
      - type
      - code
      - message
    ChatCompletionModerationResults:
      type: object
      properties:
        type:
          type: string
          enum:
          - moderation_results
          x-stainless-const: true
        model:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/ModerationResultBody'
      required:
      - type
      - model
      - results
    ChatCompletionNamedToolChoice:
      type: object
      properties:
        type:
          type: string
          enum:
          - function
          x-stainless-const: true
        function:
          type: object
          properties:
            name:
              type: string
          required:
          - name
      required:
      - type
      - function
    ChatCompletionNamedToolChoiceCustom:
      type: object
      properties:
        type:
          type: string
          enum:
          - custom
          x-stainless-const: true
        custom:
          type: object
          properties:
            name:
              type: string
          required:
          - name
      required:
      - type
      - custom
    ChatCompletionRequestAssistantMessage:
      type: object
      properties:
        content:
          anyOf:
          - oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ChatCompletionRequestAssistantMessageContentPart'
              minItems: 1
          - type: 'null'
        refusal:
          anyOf:
          - type: string
          - type: 'null'
        role:
          type: string
          enum:
          - assistant
          x-stainless-const: true
        name:
          type: string
        audio:
          anyOf:
          - type: object
            required:
            - id
            properties:
              id:
                type: string
          - type: 'null'
        tool_calls:
          $ref: '#/components/schemas/ChatCompletionMessageToolCalls'
        function_call:
          anyOf:
          - type: object
            deprecated: true
            properties:
              arguments:
                type: string
              name:
                type: string
            required:
            - arguments
            - name
          - type: 'null'
      required:
      - role
    ChatCompletionRequestAssistantMessageContentPart:
      oneOf:
      - $ref: '#/components/schemas/ChatCompletionRequestMessageContentPartText'
      - $ref: '#/components/schemas/ChatCompletionRequestMessageContentPartRefusal'
      discriminator:
        propertyName: type
    ChatCompletionRequestDeveloperMessage:
      type: object
      properties:
        content:
          oneOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/ChatCompletionRequestMessageContentPartText'
            minItems: 1
        role:
          type: string
          enum:
          - developer
          x-stainless-const: true
        name:
          type: string
      required:
      - content
      - role
    ChatCompletionRequestFunctionMessage:
      type: object
      deprecated: true
      properties:
        role:
          type: string
          enum:
          - function
          x-stainless-const: true
        content:
          anyOf:
          - type: string
          - type: 'null'
        name:
          type: string
      required:
      - role
      - content
      - name
    ChatCompletionRequestMessage:
      oneOf:
      - $ref: '#/components/schemas/ChatCompletionRequestDeveloperMessage'
      - $ref: '#/components/schemas/ChatCompletionRequestSystemMessage'
      - $ref: '#/components/schemas/ChatCompletionRequestUserMessage'
      - $ref: '#/components/schemas/ChatCompletionRequestAssistantMessage'
      - $ref: '#/components/schemas/ChatCompletionRequestToolMessage'
      - $ref: '#/components/schemas/ChatCompletionRequestFunctionMessage'
      discriminator:
        propertyName: role
    ChatCompletionRequestMessageContentPartAudio:
      type: object
      properties:
        type:
          type: string
          enum:
          - input_audio
          x-stainless-const: true
        input_audio:
          type: object
          properties:
            data:
              type: string
            format:
              type: string
              enum:
              - wav
              - mp3
          required:
          - data
          - format
        prompt_cache_breakpoint:
          $ref: '#/components/schemas/PromptCacheBreakpointParam'
      required:
      - type
      - input_audio
    ChatCompletionRequestMessageContentPartFile:
      type: object
      properties:
        type:
          type: string
          enum:
          - file
          x-stainless-const: true
        file:
          type: object
          properties:
            filename:
              type: string
            file_data:
              type: string
            file_id:
              type: string
        prompt_cache_breakpoint:
          $ref: '#/components/schemas/PromptCacheBreakpointParam'
      required:
      - type
      - file
    ChatCompletionRequestMessageContentPartImage:
      type: object
      properties:
        type:
          type: string
          enum:
          - image_url
          x-stainless-const: true
        image_url:
          type: object
          properties:
            url:
              type: string
              format: uri
            detail:
              type: string
              enum:
              - auto
              - low
              - high
              - original
              default: auto
          required:
          - url
        prompt_cache_breakpoint:
          $ref: '#/components/schemas/PromptCacheBreakpointParam'
      required:
      - type
      - image_url
    ChatCompletionRequestMessageContentPartRefusal:
      type: object
      properties:
        type:
          type: string
          enum:
          - refusal
          x-stainless-const: true
        refusal:
          type: string
      required:
      - type
      - refusal
    ChatCompletionRequestMessageContentPartText:
      type: object
      properties:
        type:
          type: string
          enum:
          - text
          x-stainless-const: true
        text:
          type: string
        prompt_cache_breakpoint:
          $ref: '#/components/schemas/PromptCacheBreakpointParam'
      required:
      - type
      - text
    ChatCompletionRequestSystemMessage:
      type: object
      properties:
        content:
          oneOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/ChatCompletionRequestSystemMessageContentPart'
            minItems: 1
        role:
          type: string
          enum:
          - system
          x-stainless-const: true
        name:
          type: string
      required:
      - content
      - role
    ChatCompletionRequestSystemMessageContentPart:
      oneOf:
      - $ref: '#/components/schemas/ChatCompletionRequestMessageContentPartText'
    ChatCompletionRequestToolMessage:
      type: object
      properties:
        role:
          type: string
          enum:
          - tool
          x-stainless-const: true
        content:
          oneOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/ChatCompletionRequestToolMessageContentPart'
            minItems: 1
        tool_call_id:
          type: string
      required:
      - role
      - content
      - tool_call_id
    ChatCompletionRequestToolMessageContentPart:
      oneOf:
      - $ref: '#/components/schemas/ChatCompletionRequestMessageContentPartText'
    ChatCompletionRequestUserMessage:
      type: object
      properties:
        content:
          oneOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/ChatCompletionRequestUserMessageContentPart'
            minItems: 1
        role:
          type: string
          enum:
          - user
          x-stainless-const: true
        name:
          type: string
      required:
      - content
      - role
    ChatCompletionRequestUserMessageContentPart:
      oneOf:
      - $ref: '#/components/schemas/ChatCompletionRequestMessageContentPartText'
      - $ref: '#/components/schemas/ChatCompletionRequestMessageContentPartImage'
      - $ref: '#/components/schemas/ChatCompletionRequestMessageContentPartAudio'
      - $ref: '#/components/schemas/ChatCompletionRequestMessageContentPartFile'
    ChatCompletionResponseMessage:
      type: object
      properties:
        content:
          anyOf:
          - type: string
          - type: 'null'
        refusal:
          anyOf:
          - type: string
          - type: 'null'
        tool_calls:
          anyOf:
          - $ref: '#/components/schemas/ChatCompletionMessageToolCalls'
          - type: 'null'
        annotations:
          type: array
          items:
            type: object
            required:
            - type
            - url_citation
            properties:
              type:
                type: string
                enum:
                - url_citation
                x-stainless-const: true
              url_citation:
                type: object
                required:
                - end_index
                - start_index
                - url
                - title
                properties:
                  end_index:
                    type: integer
                  start_index:
                    type: integer
                  url:
                    type: string
                    format: uri
                  title:
                    type: string
        role:
          type: string
          enum:
          - assistant
          x-stainless-const: true
        function_call:
          type:
          - object
          - 'null'
          deprecated: true
          properties:
            arguments:
              type: string
            name:
              type: string
          required:
          - name
          - arguments
        audio:
          anyOf:
          - type: object
            required:
            - id
            - expires_at
            - data
            - transcript
            properties:
              id:
                type: string
              expires_at:
                type: integer
                format: unixtime
              data:
                type: string
              transcript:
                type: string
          - type: 'null'
      required:
      - role
      - content
    ChatCompletionStreamOptions:
      anyOf:
      - type: object
        properties:
          include_usage:
            type: boolean
          include_obfuscation:
            type: boolean
      - type: 'null'
    ChatCompletionStreamResponseDelta:
      type: object
      properties:
        audio:
          type: object
          properties:
            id:
              type: string
            expires_at:
              type: integer
              format: unixtime
            data:
              type: string
            transcript:
              type: string
        content:
          anyOf:
          - type: string
          - type: 'null'
        function_call:
          deprecated: true
          type: object
          properties:
            arguments:
              type: string
            name:
              type: string
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionMessageToolCallChunk'
        role:
          type: string
          enum:
          - developer
          - system
          - user
          - assistant
          - tool
        refusal:
          anyOf:
          - type: string
          - type: 'null'
    ChatCompletionTokenLogprob:
      type: object
      properties:
        token:
          type: string
        logprob:
          type: number
        bytes:
          anyOf:
          - type: array
            items:
              type: integer
          - type: 'null'
        top_logprobs:
          type: array
          items:
            type: object
            properties:
              token:
                type: string
              logprob:
                type: number
              bytes:
                anyOf:
                - type: array
                  items:
                    type: integer
                - type: 'null'
            required:
            - token
            - logprob
            - bytes
      required:
      - token
      - logprob
      - bytes
      - top_logprobs
    ChatCompletionTool:
      type: object
      properties:
        type:
          type: string
          enum:
          - function
