    ModelResponseProperties:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        top_logprobs:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 20
          - type: 'null'
        temperature:
          anyOf:
          - type: number
            minimum: 0
            maximum: 2
            default: 1
          - type: 'null'
        top_p:
          anyOf:
          - type: number
            minimum: 0
            maximum: 1
            default: 1
          - type: 'null'
        user:
          type:
          - string
          - 'null'
          deprecated: true
        safety_identifier:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
        prompt_cache_key:
          anyOf:
          - type: string
          - type: 'null'
        prompt_cache_retention:
          deprecated: true
          anyOf:
          - type: string
            enum:
            - in_memory
            - 24h
          - type: 'null'
    ModerationConfigParam:
      properties:
        mode:
          $ref: '#/components/schemas/ModerationMode'
      type: object
      required:
      - mode
    ModerationInputType:
      type: string
      enum:
      - text
      - image
    ModerationMode:
      type: string
      enum:
      - score
      - block
    ModerationParam:
      properties:
        model:
          type: string
        policy:
          anyOf:
          - $ref: '#/components/schemas/ModerationPolicyParam'
          - type: 'null'
      type: object
      required:
      - model
    ModerationPolicyParam:
      properties:
        input:
          anyOf:
          - $ref: '#/components/schemas/ModerationConfigParam'
          - type: 'null'
        output:
          anyOf:
          - $ref: '#/components/schemas/ModerationConfigParam'
          - type: 'null'
      type: object
      required: []
    ModerationResultBody:
      properties:
        type:
          type: string
          enum:
          - moderation_result
          default: moderation_result
          x-stainless-const: true
        model:
          type: string
        flagged:
          type: boolean
        categories:
          additionalProperties:
            type: boolean
          type: object
          x-oaiTypeLabel: map
        category_scores:
          additionalProperties:
            type: number
          type: object
          x-oaiTypeLabel: map
        category_applied_input_types:
          additionalProperties:
            items:
              $ref: '#/components/schemas/ModerationInputType'
            type: array
          type: object
          x-oaiTypeLabel: map
      type: object
      required:
      - type
      - model
      - flagged
      - categories
      - category_scores
      - category_applied_input_types
    ParallelToolCalls:
      type: boolean
      default: true
    PredictionContent:
      type: object
      required:
      - type
      - content
      properties:
        type:
          type: string
          enum:
          - content
          x-stainless-const: true
        content:
          oneOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/ChatCompletionRequestMessageContentPartText'
            minItems: 1
    PromptCacheBreakpointParam:
      properties:
        mode:
          type: string
          enum:
          - explicit
          default: explicit
          x-stainless-const: true
        ttl:
          type: string
          enum:
          - 30m
          - 12h
      type: object
      required:
      - mode
    PromptCacheModeEnum:
      type: string
      enum:
      - implicit
      - explicit
    PromptCacheOptionsParam:
      properties:
        ttl:
          $ref: '#/components/schemas/PromptCacheTTLEnum'
        mode:
          $ref: '#/components/schemas/PromptCacheModeEnum'
      type: object
      required: []
    PromptCacheTTLEnum:
      type: string
      enum:
      - 30m
    ReasoningEffort:
      anyOf:
      - type: string
        enum:
        - none
        - minimal
        - low
        - medium
        - high
        - xhigh
        - max
        default: medium
      - type: 'null'
    ResponseFormatJsonObject:
      type: object
      properties:
        type:
          type: string
          enum:
          - json_object
          x-stainless-const: true
      required:
      - type
    ResponseFormatJsonSchema:
      type: object
      properties:
        type:
          type: string
          enum:
          - json_schema
          x-stainless-const: true
        json_schema:
          x-openai-structured-output: json_schema
          type: object
          properties:
            description:
              type: string
            name:
              type: string
            schema:
              $ref: '#/components/schemas/ResponseFormatJsonSchemaSchema'
            strict:
              anyOf:
              - type: boolean
                default: false
              - type: 'null'
          required:
          - name
      required:
      - type
      - json_schema
    ResponseFormatJsonSchemaSchema:
      type: object
      additionalProperties: true
    ResponseFormatText:
      type: object
      properties:
        type:
          type: string
          enum:
          - text
          x-stainless-const: true
      required:
      - type
    ResponseModalities:
      anyOf:
      - type: array
        items:
          type: string
          enum:
          - text
          - audio
      - type: 'null'
    ServiceTier:
      anyOf:
      - type: string
        enum:
        - auto
        - default
        - flex
        - scale
        - priority
        - fast
        default: auto
      - type: 'null'
    StopConfiguration:
      default: null
      oneOf:
      - type: string
        default: <|endoftext|>
      - type: array
        minItems: 1
        maxItems: 4
        items:
          type: string
      - type: 'null'
    Verbosity:
      anyOf:
      - type: string
        enum:
        - low
        - medium
        - high
        default: medium
      - type: 'null'
    VoiceIdsOrCustomVoice:
      anyOf:
      - $ref: '#/components/schemas/VoiceIdsShared'
      - type: object
        additionalProperties: false
        required:
        - id
        properties:
          id:
            type: string
    VoiceIdsShared:
      anyOf:
      - type: string
      - type: string
        enum:
        - alloy
        - ash
        - ballad
        - coral
        - echo
        - sage
        - shimmer
        - verse
        - marin
        - cedar
    WebSearchContextSize:
      type: string
      enum:
      - low
      - medium
      - high
      default: medium
    WebSearchLocation:
      type: object
      properties:
        country:
          type: string
        region:
          type: string
        city:
          type: string
        timezone:
          type: string
    _MisalignmentErrorType:
      anyOf:
      - type: string
      - type: string
        enum:
        - potentially_unintended_data_transfer
        - potentially_unintended_data_access
        - potentially_unintended_destructive_activity
        - other
    _MisalignmentSteer:
      properties:
        message:
          type: string
      type: object
      required:
      - message
  responses:
    InferenceRateLimited:
      description: The request was rejected because a rate limit was exceeded. A slow_down
        error means traffic increased too quickly; reduce your request rate, then
        increase it gradually.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InferenceServiceUnavailable:
      description: The service is temporarily unavailable. A server_is_overloaded
        error means the requested model is temporarily overloaded; retry after a brief
        delay.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: The request was rejected because a rate limit was exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
