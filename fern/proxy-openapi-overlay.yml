overlay: 1.0.0
info:
  title: Experimental proxy API documentation additions
  version: 1.0.0
actions:
- target: $
  update:
    info:
      title: Experimental Guardrails Proxy API
      description: |
        Reference for the built-in OpenAI provider's guarded operations in an
        example deployment. Provider mounts, path prefixes, operation selection,
        and custom bindings can change the routes and inspection boundaries.
- target: $.paths['/v1/chat/completions'].post
  update:
    summary: Create a guarded chat completion
    description: |
      This page describes the built-in native OpenAI guard boundary at an
      example URL. Provider mounts and path prefixes can change the route.
      Set `stream` to `true` for SSE. Enabled Rails checks depend on configuration.

      See [field-policy meanings](/run-guardrailed-inference/using-proxy/guard-contracts#read-the-field-policy),
      [supported input and output](/run-guardrailed-inference/using-proxy/providers-and-streaming#coverage-of-the-shipped-profiles),
      and [streaming completion and errors](/run-guardrailed-inference/using-proxy/providers-and-streaming#completion-and-errors).
      Field types describe proxy validation; consult the
      [provider reference](https://developers.openai.com/api/reference/resources/chat/subresources/completions/methods/create)
      for upstream requirements. Replace `example-model` with a model available
      from your provider.
    x-fern-examples:
      - name: Buffered example
        request: {"model":"example-model","messages":[{"role":"user","content":"Hello!"}]}
        response:
          body: {"choices":[{"message":{"role":"assistant","content":"Hello!"}}]}
        code-samples:
          - sdk: curl
            code: |
              curl http://localhost:8000/v1/chat/completions \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $OPENAI_API_KEY" \
                -d '{"model":"example-model","messages":[{"role":"user","content":"Hello!"}]}'
    responses:
      "200":
        description: |
          Provider-native JSON or SSE. The JSON example is an illustrative excerpt.
          Output restrictions apply only when output inspection is enabled.
          After SSE headers, failures are reported in the stream rather than by
          changing the HTTP status.
        content:
          application/json:
            examples:
              completion:
                summary: Buffered chat completion
                value:
                  choices:
                    - message:
                        role: assistant
                        content: Hello!
    requestBody:
      content:
        application/json:
          examples:
            buffered:
              summary: Buffered chat completion
              value:
                model: example-model
                messages:
                  - role: user
                    content: Hello!
- target: $.paths['/v1/responses'].post
  update:
    summary: Create a guarded response
    description: |
      This page describes the built-in native OpenAI guard boundary at an
      example URL. Provider mounts and path prefixes can change the route.
      Set `store` to `false` and `stream` to `true` for SSE. Enabled Rails checks
      depend on configuration.

      See [field-policy meanings](/run-guardrailed-inference/using-proxy/guard-contracts#read-the-field-policy),
      [supported input and output](/run-guardrailed-inference/using-proxy/providers-and-streaming#coverage-of-the-shipped-profiles),
      and [streaming completion and errors](/run-guardrailed-inference/using-proxy/providers-and-streaming#completion-and-errors).
      Field types describe proxy validation; consult the
      [provider reference](https://developers.openai.com/api/reference/resources/responses/methods/create)
      for upstream requirements. Replace `example-model` with a model available
      from your provider.
    x-fern-examples:
      - name: Buffered example
        request: {"model":"example-model","input":"Hello!","store":false}
        response:
          body: {"id":"resp_example","object":"response","output":[{"type":"message","role":"assistant","id":"msg_example","content":[{"type":"output_text","text":"Hello!","annotations":[],"logprobs":[]}]}]}
        code-samples:
          - sdk: curl
            code: |
              curl http://localhost:8000/v1/responses \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $OPENAI_API_KEY" \
                -d '{"model":"example-model","input":"Hello!","store":false}'
    responses:
      "200":
        description: |
          Provider-native JSON or SSE. The JSON example is an illustrative excerpt.
          Output restrictions apply only when output inspection is enabled.
          After SSE headers, failures are reported in the stream rather than by
          changing the HTTP status.
        content:
          application/json:
            examples:
              response:
                summary: Buffered response
                value:
                  id: resp_example
                  object: response
                  output:
                    - type: message
                      role: assistant
                      id: msg_example
                      content:
                        - type: output_text
                          text: Hello!
                          annotations: []
                          logprobs: []
    requestBody:
      content:
        application/json:
          examples:
            buffered:
              summary: Buffered response
              value:
                model: example-model
                input: Hello!
                store: false
