# uv manages all dependencies and the current package.
# Thus, tests are running against the local files and not the built and installed package.
# How to use:
# do
# > pyenv install 3.10 3.11 3.12 3.13
# > pyenv local 3.10 3.11 3.12 3.13

[tox]
envlist = py310, py311, py312, py313

[testenv]
description = Run tests with pytest under different Python versions
runner = uv-venv-lock-runner
extras = all
dependency_groups = dev
commands =
    pytest tests/ --import-mode importlib

[pytest]
asyncio_default_fixture_loop_scope = function
