[package]
name = "nemo-guardrails-dogwood"
version = "0.1.0"
description = "Python binding of the Dogwood policy language (dogwood-ops) for the NeMo Guardrails hooks server"
authors = ["NVIDIA Corporation"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA-NeMo/Guardrails"
rust-version = "1.96.1"
publish = false

# Its own workspace, with its own Cargo.lock: the root workspace and lock are the Relay plugin's, which
# NeMo-Relay-Plugins builds from.
[workspace]

[lib]
name = "nemoguardrails_dogwood"
crate-type = ["cdylib"]

[dependencies]
# The Dogwood language's own operations: parse, lower, type-check, and the stateful authorizer. Pinned exactly so a
# Guardrails release decides as one Dogwood release does.
dogwood-ops = "=1.2.0"
# Named only to turn on its off-by-default arithmetic feature; the same version dogwood-ops uses.
dogwood-language = { version = "=1.2.0", optional = true }
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py311"] }
serde_json = "1"

[features]
# On by default so the whole language Dogwood's reference examples use is there: four of them compare with
# arithmetic (`total - x > 10`), which Dogwood itself still marks experimental and keeps off by default.
default = ["experimental-arithmetic"]
experimental-arithmetic = ["dep:dogwood-language", "dogwood-language/experimental-arithmetic"]
