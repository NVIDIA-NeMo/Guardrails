[package]
name = "nemo-guardrails-relay-plugin"
version = "0.1.0"
description = "NeMo Relay plugin that checks tool calls as a client of the NeMo Guardrails service"
authors = ["NVIDIA Corporation"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA-NeMo/Guardrails"
rust-version = "1.96.1"
publish = false

[lib]
# `cdylib` is the library Relay loads; `rlib` lets the tests reach the modules.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The native ABI changes with each Relay minor release, so the SDK stays on one minor.
# 0.10.1 matches the manifest's `compat.relay` floor.
nemo-relay-plugin = "0.10.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
log = { version = "0.4", features = ["kv_serde"] }
nemo-relay = { version = "0.10.1", default-features = false, features = ["__skip-implicit-config"] }
semver = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
toml = "0.9"
wiremock = "0.6.5"
