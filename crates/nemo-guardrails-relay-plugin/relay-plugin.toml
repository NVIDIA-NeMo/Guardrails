manifest_version = 1
description = "Calls the NeMo Guardrails service to check each tool call that Relay manages."

[plugin]
id = "nvidia.nemo_guardrails"
name = "NVIDIA NeMo Guardrails Plugin"
kind = "rust_dynamic"

[compat]
# 0.11.0-rc.1 is the floor: through 0.10, Relay runs the guardrail again on Claude Code's and
# Codex's PermissionRequest, so a call that reaches a permission prompt is checked twice (removed
# in NVIDIA/NeMo-Relay#1388). Relay matches a pre-release host as its release unless a bound names
# a pre-release, so a plain `>=0.11.0` would admit the 0.11.0 alphas that still rerun it. rc.1 is
# the first 0.11 build Relay published, and every 0.11.0 alpha sorts below it.
relay = ">=0.11.0-rc.1,<1.0"
native_api = "1"

[defaults]
enabled = false

[capabilities]
items = ["plugin_native", "config_schema"]

[config_schema]
path = "config.schema.json"

# scripts/package_bundle.py fills in the placeholders below.
[source]
artifact = "<platform-library-file>"

[integrity]
sha256 = "sha256:<artifact-sha256>"

[load]
library = "<platform-library-file>"
symbol = "nemo_relay_register_plugin"
