# The policy for agent.py's tool calls, which NeMo Relay forwards to `nemoguardrails hooks-server`:
#
#   nemoguardrails hooks-server --config examples/scripts/nemo_relay/configs/policy
#
# No model is called and no API key is needed: the checks are the tool lists and CEL expressions.

models: []

hooks_server:
  # Deep Agents adds its own tools to the agent's, so they are listed too. `execute` (a shell) and `delete` are
  # left out, so with `allow_unlisted_tools: false` every call to them is denied.
  allowed_tools:
    - name: search_runbooks
      arguments: [query]
    - name: read_log
      arguments: [service, lines]
    - name: http_request
      arguments: [method, url, body]
    - name: ls
      arguments: [path]
    - name: read_file
      arguments: [file_path, offset, limit]
    - name: write_file
      arguments: [file_path, content]
    - name: edit_file
      arguments: [file_path, old_string, new_string, replace_all]
    - name: glob
      arguments: [pattern, path]
    - name: grep
      arguments: [pattern, path, glob, output_mode, max_count]
    - name: task
      arguments: [description, subagent_type]
  allow_unlisted_tools: false

rails:
  tool_call:
    per_tool:
      read_log:
        - cel check tool call
      http_request:
        - cel check tool call

  config:
    cel:
      tool_call:
        # Each expression is true for a call to block. An expression that errors, such as on an argument the call
        # leaves out, fails the check and stops the run, so each first checks that its argument is there.
        read_log:
          expressions:
            - '!has(args.lines) || type(args.lines) != int || args.lines < 1 || args.lines > 500'
        http_request:
          expressions:
            - '!has(args.method) || type(args.method) != string || args.method.upperAscii() != "GET"'
            - '!has(args.url) || type(args.url) != string || !args.url.matches("^https://([a-z0-9-]+\\.)*internal\\.example(/|$)")'
