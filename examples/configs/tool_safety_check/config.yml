models:
  - type: main
    engine: nim
    model: meta/llama-3.3-70b-instruct

  - type: llama_guard
    engine: nim
    model: meta/llama-guard-3-8b

rails:
  tool_call:
    flows:
      - tool call validation
    per_tool:
      run_sql: ["tool safety check tool call $model=llama_guard $variant=run_sql_check $argument=query"]
  tool_result:
    flows:
      - tool result validation
    per_tool:
      run_sql: ["tool safety check tool result $model=llama_guard $variant=run_sql_check"]
