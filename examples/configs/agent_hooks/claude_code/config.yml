# Needs Claude Code 2.1.295 or later. HTTP hooks came in 2.1.63, but `onFailure: "block"`, which makes a check that
# fails block the tool instead of letting it run, came in 2.1.295.
#
# Checks Claude Code's tool calls before they run, with `nemoguardrails hooks-server`:
#
#   nemoguardrails hooks-server --config examples/configs/agent_hooks/claude_code
#
# Point Claude Code's `PreToolUse` hook at http://localhost:8100/v1/hooks/claude-code.
# The server applies its one config on every path it serves. Rails are chosen by the tool name in each call, never by
# the path, which only picks the request and response format. So this config holds the tools Claude Code calls; the
# `codex` and `nemo_relay` examples beside it hold theirs. A server for both Claude Code and Codex merges the two.
# The server only runs tool-call rails. Every rail here is a regex, so no model is called and no API key is needed.

models:
  # A tool check needs a `main` model: it sets the tool format and declares the tools. The server never calls it.
  - type: main
    engine: nim
    model: nvidia/nemotron-3.5-super-vl-120b-a12b
    parameters:
      # The allowlist. With `tool call validation` below, a call to any tool not declared here is denied,
      # MCP tools (`mcp__<server>__<tool>`) included. This is a starting set: declare every tool you use.
      # A tool with a per-tool rail must be declared even without `tool call validation`.
      # `{type: object}` alone declares a tool that takes no arguments, so these schemas allow any arguments.
      tools:
        - {type: function, function: {name: Bash, parameters: {type: object, additionalProperties: true}}}
        - {type: function, function: {name: Read, parameters: {type: object, additionalProperties: true}}}
        - {type: function, function: {name: Write, parameters: {type: object, additionalProperties: true}}}
        - {type: function, function: {name: Edit, parameters: {type: object, additionalProperties: true}}}
        - {type: function, function: {name: Glob, parameters: {type: object, additionalProperties: true}}}
        - {type: function, function: {name: Grep, parameters: {type: object, additionalProperties: true}}}
        - {type: function, function: {name: WebFetch, parameters: {type: object, additionalProperties: true}}}
        - {type: function, function: {name: WebSearch, parameters: {type: object, additionalProperties: true}}}

rails:
  tool_call:
    # Global rails run on every tool call. Remove this to allow undeclared tools without a check;
    # then only the tools under `per_tool` are checked.
    flows:
      - tool call validation

    # Per-tool rails run on calls to the tool named, spelled exactly as Claude Code sends it.
    per_tool:
      Bash:
        - regex check tool call $argument=command
      Read:
        - regex check tool call $argument=file_path
      Write:
        - regex check tool call $argument=file_path
      Edit:
        - regex check tool call $argument=file_path

  config:
    # Placeholder patterns for the per-tool rails above. Each is matched against the argument as JSON,
    # such as {"file_path": "C:\\project\\.env"}, so a path separator can be `/` or an escaped `\`.
    # They show the shape of a policy, not a complete one: a regex is easy to get around, for example
    # with `rm -fr` or `rm -r -f` for the first Bash pattern.
    # The secrets-file patterns ignore case, since macOS and Windows file systems do.
    regex_detection:
      tool_call:
        Bash:
          patterns:
            - '\brm\s+-rf\b'
            - '\bgit\s+push\s+(--force|-f)\b'
            - 'curl\b[^|]*\|\s*(ba)?sh\b'
        Read:
          case_insensitive: true
          patterns:
            - '[/\\"]\.env\b'
            - '[/\\"]\.ssh[/\\]'
            - '[/\\"]\.aws[/\\]+credentials\b'
        Write:
          case_insensitive: true
          patterns:
            - '[/\\"]\.env\b'
            - '[/\\"]\.ssh[/\\]'
            - '[/\\"]\.aws[/\\]+credentials\b'
        Edit:
          case_insensitive: true
          patterns:
            - '[/\\"]\.env\b'
            - '[/\\"]\.ssh[/\\]'
            - '[/\\"]\.aws[/\\]+credentials\b'
