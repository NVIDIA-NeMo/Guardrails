# Needs NeMo Relay 0.10.1 or later: at 0.10.0, an error from the guardrail let a Claude Code tool call run.
# Behind NeMo Relay's Claude Code or Codex integration, the agent's version is NeMo Relay's to set, not this server's.
#
# Checks the tool calls a NeMo Relay plugin's tool conditional-execution guardrail forwards, with
# `nemoguardrails hooks-server`:
#
#   nemoguardrails hooks-server --config examples/configs/agent_hooks/nemo_relay
#
# The plugin's guardrail posts each call's tool name and arguments to http://localhost:8100/v1/hooks/nemo-relay.
# The server applies its one config on every path it serves. Rails are chosen by the tool name in each call, never by
# the path, which only picks the request and response format. So this config holds only the tools NeMo Relay forwards.
# To check Claude Code's or Codex's own hooks too, run a second server with that agent's example on another `--port`.
# NeMo Relay forwards the tool names of whatever it wraps. This example is for an application tool, `search`, as in
# NeMo Relay's "Add a Tool Policy", whose policy rejects a search without a query. Behind NeMo Relay's Claude Code or
# Codex integration, the tool names are that agent's, so use the `claude_code` or `codex` example's tools and rails.
# The server applies the tool policy, then tool-call rails. The checks here are the tool lists and a regex, so no
# model is called and no API key is needed.

# The server checks tool calls and never generates a response, so the config needs no model.
models: []

# The tool policy, which the hooks server applies to each call before any rail runs.
hooks_server:
  # The allowlist, and each tool's arguments. With `allow_unlisted_tools: false`, a call to any tool not listed
  # here is denied, and so is a `search` that passes an argument other than `query`.
  allowed_tools:
    - name: search
      arguments: [query]
  allow_unlisted_tools: false

rails:
  tool_call:
    # The policy for `search`: a search needs a query, and the query a non-empty string.
    per_tool:
      search:
        - regex check tool call $argument=query

  config:
    regex_detection:
      tool_call:
        search:
          # Each pattern is matched against the call's `query` as JSON, such as {"query": "weather"}. A call without
          # `query` is matched against all its arguments, which the allowlist leaves empty: {}.
          patterns:
            # An empty query.
            - '^\{"query": ""\}$'
            # A query that isn't a string.
            - '^\{"query": [^"]'
            # No query.
            - '^\{\}$'
